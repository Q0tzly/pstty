name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          fmt="$(gofmt -l .)"
          if [ -n "$fmt" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt"
            exit 1
          fi

      # -race is skipped on macOS: the race-instrumented test binaries hit
      # a known Go/macOS dyld incompatibility ("missing LC_UUID load
      # command") that aborts them before any test runs, unrelated to
      # this project's code.
      - name: Test
        if: runner.os == 'Linux'
        run: go test ./... -race

      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...
