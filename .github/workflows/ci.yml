name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The macos-latest runner's Xcode/dyld hits "missing LC_UUID load
      # command" on any cgo-linked binary (net's test binaries included)
      # — unrelated to this project. CGO_ENABLED=0 avoids the external
      # linker entirely; it also rules out -race there, which needs cgo.
      CGO_ENABLED: ${{ matrix.os == 'macos-latest' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          fmt="$(gofmt -l .)"
          if [ -n "$fmt" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt"
            exit 1
          fi

      - name: Test
        if: runner.os == 'Linux'
        run: go test ./... -race

      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...
